<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаблонизатор гербариев А4</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
</head>
<body>

<div class="sidebar">
  <div class="controls">
    <div class="sidebar-title">Управление</div>
    <button onclick="addPage()">+ Добавить страницу</button>
    <button onclick="window.print()">🖨 Печать</button>
    <button onclick="clearAll()">Очистить всё</button>

    <div class="border-style-options">
      <button onclick="saveProject()">💾 Сохранить проект</button>
      <button onclick="document.getElementById('loadProjectInput').click()">📂 Загрузить проект</button>
      <input type="file" id="loadProjectInput" accept=".json" style="display:none" onchange="loadProject(this)">
    </div>

    <div class="border-style-options">
      <label>Нейросеть:
        <select id="aiProviderSelect" onchange="loadProviderConfig()">
          <option value="deepseek">DeepSeek</option>
          <option value="yandex">YandexGPT</option>
        </select>
      </label>
      <input type="password" id="apiKeyInput" placeholder="Введите API-ключ" style="margin-top: 5px; width: 100%;" />
      
      <!-- ДОБАВЛЕННЫЙ БЛОК FOLDER ID ДЛЯ YANDEX -->
      <div id="yandexFolderGroup" style="display: none; margin-top: 8px;">
        <label style="display: block; font-size: 13px; margin-bottom: 2px;">Folder ID (Каталог):</label>
        <input type="text" id="folderIdInput" placeholder="b1g..." style="width: 100%; padding: 4px 6px; font-family: inherit; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;">
      </div>
    </div>

    <div class="border-style-options">
      <label><input type="radio" name="borderStyle" value="mode-full" checked onchange="applyBorderStyle()"> Полная рамка</label>
      <label><input type="radio" name="borderStyle" value="mode-left" onchange="applyBorderStyle()"> Только слева (дырокол)</label>
      <label><input type="radio" name="borderStyle" value="mode-none" onchange="applyBorderStyle()"> Без рамок</label>
    </div>
  </div>

  <div class="ai-panel" id="aiPanel">
    <div class="ai-panel-title">Проверка данных</div>
    <div class="ai-status" id="aiStatus">Здесь появится результат.</div>

    <div class="ai-result">
      <div class="ai-result-row">
        <div class="ai-result-label">ЛАТИНСКОЕ НАЗВАНИЕ</div>
        <div class="ai-result-value" id="aiLatinResult"></div>
      </div>
      <div class="ai-result-row">
        <div class="ai-result-label">ТАКСОНОМИЯ</div>
        <div class="ai-result-value" id="aiTaxonomyResult"></div>
      </div>
      <div class="ai-result-row">
        <div class="ai-result-label">ОПИСАНИЕ</div>
        <div class="ai-result-value" id="aiDescriptionResult"></div>
      </div>
    </div>

    <div class="ai-actions">
      <button class="apply-button" id="applyAiButton" onclick="applyAIResult()" disabled>ПРИМЕНИТЬ</button>
      <button onclick="closeAIPanel()">Отмена</button>
    </div>
  </div>
</div>

<div class="main-content">
  <div class="pages-container" id="pagesContainer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
