<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаблонизатор гербариев А4</title>
<link rel="stylesheet" href="css/style.css">

</head>
<body>
<div class="sidebar">
  <!-- Управление -->
  <div class="controls">
    <div class="sidebar-title">Управление</div>
    <button id="btnAddPage">+ Добавить гербарный лист</button>
    <button id="btnPrint">🖨 Печать</button>
    <button id="btnClear">Очистить всё</button>
    <div class="border-style-options">
      <button id="btnSave">💾 Сохранить проект</button>
      <button id="btnLoadTrigger">📂 Загрузить проект</button>
      <input type="file" id="loadProjectInput" accept=".json" style="display:none">
    </div>
    <div class="border-style-options">
      <label><input type="radio" name="borderStyle" value="mode-full" checked> Полная рамка</label>
      <label><input type="radio" name="borderStyle" value="mode-left"> Только слева (дырокол)</label>
      <label><input type="radio" name="borderStyle" value="mode-none"> Без рамок</label>
    </div>
  </div>

  <!-- Документ -->
  <div class="document-controls">
    <div class="sidebar-title">Документ</div>
    <button id="btnAddCover">+ Титульный лист</button>
    <button id="btnBuildDocument">📋 Собрать документ</button>
    <button id="btnRebuildToc">📝 Обновить содержание</button>
    <button id="btnGenerateDividers">🤖 AI → Разделители</button>
    <button id="btnAddConclusion">+ Заключение</button>
  </div>

  <!-- Настройки AI -->
  <div class="ai-settings" id="aiSettings">
    <div class="sidebar-title">Настройки AI</div>
    <div class="ai-setting-row">
      <label>Провайдер:</label>
      <select id="aiProvider">
        <option value="deepseek">DeepSeek</option>
        <option value="yandex">Yandex GPT</option>
      </select>
    </div>
    <div class="ai-setting-row">
      <label>API-ключ:</label>
      <input type="password" id="aiApiKey" placeholder="Вставь свой ключ...">
    </div>
    <button id="btnSaveKeys" style="margin-top:6px">💾 Сохранить ключ</button>
    <div class="ai-status-mini" id="aiKeyStatus">Ключ не сохранён</div>
  </div>

  <!-- AI панель (herbarium) -->
  <div class="ai-panel" id="aiPanel">
    <div class="ai-panel-title">Проверка данных AI</div>
    <div class="ai-status" id="aiStatus">Здесь появится результат.</div>
    <div class="ai-result">
      <div class="ai-result-row"><div class="ai-result-label">ЛАТИНСКОЕ НАЗВАНИЕ</div><div class="ai-result-value" id="aiLatinResult"></div></div>
      <div class="ai-result-row"><div class="ai-result-label">ТАКСОНОМИЯ</div><div class="ai-result-value" id="aiTaxonomyResult"></div></div>
      <div class="ai-result-row"><div class="ai-result-label">ОПИСАНИЕ</div><div class="ai-result-value" id="aiDescriptionResult"></div></div>
    </div>
    <div class="ai-actions">
      <button class="apply-button" id="applyAiButton" disabled>ПРИМЕНИТЬ</button>
      <button id="cancelAiButton">Отмена</button>
    </div>
  </div>

  </div>
</div>

<div class="main-content">
  <div class="pages-container" id="pagesContainer"></div>
</div>

<!-- Существующие модули -->

<!-- ===== PAGE TEMPLATES ===== -->
<template id="tpl-cover">
  <div class="page" data-type="cover">
    <div class="page-type-badge">титул</div>
    <div class="cover-content">
      <div class="cover-top">
        <div class="cover-org" contenteditable="true" data-placeholder="МБОУ СОШ №1"></div>
        <div class="cover-city" contenteditable="true" data-placeholder="г. Москва"></div>
      </div>
      <div class="cover-center">
        <div class="cover-title-label">Проектная работа</div>
        <div class="cover-title" contenteditable="true" data-placeholder="Гербарий растений"></div>
        <div class="cover-subject" contenteditable="true" data-placeholder="Биология"></div>
      </div>
      <div class="cover-bottom">
        <div class="cover-meta-row"><span class="cover-label">Выполнил:</span><div class="cover-value" contenteditable="true" data-placeholder="ФИО обучающегося"></div></div>
        <div class="cover-meta-row"><span class="cover-label">Класс:</span><div class="cover-value" contenteditable="true" data-placeholder="7А"></div></div>
        <div class="cover-meta-row"><span class="cover-label">Руководитель:</span><div class="cover-value" contenteditable="true" data-placeholder="ФИО руководителя"></div></div>
      </div>
      <div class="cover-year" contenteditable="true" data-placeholder="2026"></div>
    </div>
  </div>
</template>

<template id="tpl-toc">
  <div class="page" data-type="toc">
    <div class="page-type-badge">содержание</div>
    <div class="toc-content">
      <div class="toc-title">Содержание</div>
      <div class="toc-body"></div>
    </div>
  </div>
</template>

<template id="tpl-divider">
  <div class="page" data-type="divider">
    <div class="page-type-badge">разделитель</div>
    <div class="divider-content">
      <div class="divider-class-ru" contenteditable="true" data-placeholder="ДВУДОЛЬНЫЕ"></div>
      <div class="divider-class-lat" contenteditable="true" data-placeholder="Magnoliopsida"></div>
      <div class="divider-history" contenteditable="true" data-placeholder="Краткая историческая справка о классе..."></div>
    </div>
  </div>
</template>

<template id="tpl-conclusion">
  <div class="page" data-type="conclusion">
    <div class="page-type-badge">заключение</div>
    <div class="conclusion-content">
      <div class="conclusion-title">Заключение</div>
      <div class="conclusion-text" contenteditable="true" data-placeholder="Текст заключения..."></div>
    </div>
  </div>
</template>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/ai-providers.js"></script>
<script src="js/ai-client.js"></script>
<script src="js/image-editor.js"></script>

<!-- Новые модули документа -->
<script src="js/document-model.js"></script>
<script src="js/cover.js"></script>
<script src="js/toc.js"></script>
<script src="js/divider.js"></script>
<script src="js/conclusion.js"></script>

<!-- Существующие + сборщик -->
<script src="js/pages.js"></script>
<script src="js/document-builder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
